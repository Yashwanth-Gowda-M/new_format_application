services:
  redis:
    image: redis:7-alpine
    container_name: assignment-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - assignment-network

  backend:
    image: ${DOCKER_USERNAME}/${IMAGE_NAME}-backend:${IMAGE_TAG}
    container_name: assignment-backend
    restart: unless-stopped
    env_file:
      - ../../.env
    depends_on:
      - redis
    ports:
      - "5000:5000"
    networks:
      - assignment-network

  frontend:
    image: ${DOCKER_USERNAME}/${IMAGE_NAME}-frontend:${IMAGE_TAG}
    container_name: assignment-frontend
    depends_on:
      - backend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - assignment-network

networks:
  assignment-network:

volumes:
  redis_data:
